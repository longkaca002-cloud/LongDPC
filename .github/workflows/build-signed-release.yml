name: Build signed LongDPC release APKs
on:
  workflow_dispatch:

jobs:
  build-signed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Validate signing secrets
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Decode release keystore
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/long-release.jks"
      - name: Build signed release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/long-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :longocr:testDebugUnitTest :longocr:assembleRelease :longswipe:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LongDPC-signed-release
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LongOCR-signed-release
          path: longocr/build/outputs/apk/release/longocr-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LongAutoSwipe-signed-release
          path: longswipe/build/outputs/apk/release/longswipe-release.apk
