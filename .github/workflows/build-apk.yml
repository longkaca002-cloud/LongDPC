name: Build LongDPC APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build and test both apps
        run: gradle :app:assembleDebug :longocr:testDebugUnitTest :longocr:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LongDPC-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LongOCR-debug-apk
          path: longocr/build/outputs/apk/debug/longocr-debug.apk
